name: Release desktop (macOS · Windows · Linux)

# Builds Draften as a native app for all three desktop OSes and attaches the
# installers to a GitHub Release. Cross-OS binaries can't be built on one machine
# — this matrix runs each on its own runner. Trigger by pushing a tag like v0.1.0,
# or run manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # universal Apple silicon + intel
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04       # Linux (.deb / .rpm / .AppImage)
            args: ""
          - platform: windows-latest     # Windows (.msi / .exe NSIS)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps (webkit, etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Build + release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Draften ${{ github.ref_name }}"
          releaseBody: "Draften desktop — macOS, Windows, Linux. Free & open source (MIT)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
