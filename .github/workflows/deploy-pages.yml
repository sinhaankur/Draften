name: Deploy web app to GitHub Pages

# Draften ships as a website (this workflow) AND as native desktop apps (a
# separate Tauri-release workflow, added later). This builds the static Vite app
# with the /Draften/ project-subpath base and publishes it to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deploy at a time; let an in-progress run finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Type-check + test
        run: |
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm exec vitest run

      - name: Build (GitHub Pages base)
        env:
          DEPLOY_TARGET: pages
        run: pnpm exec vite build

      - name: Add SPA + Jekyll-bypass files
        run: |
          # single-page app: 404 falls back to index so deep links work
          cp dist/index.html dist/404.html
          # stop GitHub Pages' Jekyll from ignoring _-prefixed asset files
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
