name: Deploy web app to GitHub Pages

# Draften ships as a website (this workflow) AND as native desktop apps (a
# separate Tauri-release workflow, added later). This builds the static Vite app
# with the /Draften/ project-subpath base and publishes it to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deploy at a time; let an in-progress run finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Type-check + test
        run: |
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm exec vitest run

      - name: Build the app (served at /app)
        env:
          DEPLOY_TARGET: pages
        run: pnpm exec vite build

      - name: Compose the Pages site — landing at root, app at /app
        run: |
          mkdir -p public_site
          # landing page (site/) at the root
          cp -R site/* public_site/
          # the in-browser app under /app
          mkdir -p public_site/app
          cp -R dist/* public_site/app/
          # SPA fallback for the app's deep links
          cp public_site/app/index.html public_site/app/404.html
          # stop Jekyll from dropping _-prefixed asset files
          touch public_site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
