<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Draften">
  <!-- Draften app icon. A deep teal-green rounded tile (macOS squircle radius),
       a soft top-light gradient for depth, and a confident geometric 'D' whose
       counter is a clean aperture — reads at 16px and looks premium at 1024px. -->
  <defs>
    <linearGradient id="g" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a7d6f"/>
      <stop offset="1" stop-color="#355d52"/>
    </linearGradient>
    <linearGradient id="sheen" x1="256" y1="40" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#g)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>
  <!-- the D: a stem + bowl with a clean, optically-centred counter. Stroke-like
       weight is even top/bottom/outer so it reads crisp from 16px to 1024px. -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M156 128h86c74 0 130 54 130 128s-56 128-130 128h-86V128zm60 58v196h26c42 0 70-39 70-98s-28-98-70-98h-26z"/>
</svg>
